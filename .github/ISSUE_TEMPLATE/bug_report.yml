name: Bug report
description: Report a reproducible problem in Fractureborn
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Please include enough detail to reproduce it reliably.

  - type: input
    id: branch
    attributes:
      label: Branch / version
      description: Which branch or build were you testing?
      placeholder: feat/vertical-slice
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - macOS
        - Windows
        - Linux
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the problem and what you observed.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the smallest reliable sequence that reproduces the issue.
      placeholder: |
        1. Start a character in slot 1
        2. Enter Green Plains
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen instead?
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Screenshots, video, logs, or save context
      description: Add any visual evidence, error output, relevant save state, or extra context.

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I reproduced this on the branch/version listed above.
          required: true
        - label: I checked that this is not already covered by an existing issue.
          required: true
